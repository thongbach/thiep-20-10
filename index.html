<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100824">
  <meta name="description" content="Một lời chúc 20/10 đáng yêu, có pháo hoa, gửi từ Rio và bạn.">
  <meta property="og:title" content="Một ngày thật dịu dàng · 20/10">
  <meta property="og:description" content="Chạm để bắt đầu câu chuyện nhỏ từ Rio và bạn, với pháo hoa và lời chúc 20/10.">
  <title>Một ngày thật dịu dàng · 20/10</title>
  <link rel="stylesheet" href="rio.css">
  <script src="rio.js" defer></script>
</head>
<body data-scene="opening">
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div class="aurora aurora--left" aria-hidden="true"></div>
  <div class="aurora aurora--right" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span aria-hidden="true">♡</span><span>RIO & BẠN&nbsp; / &nbsp;20 · 10</span></div>
  </header>


  <div class="progress" id="progress" aria-hidden="true"></div>

  <main class="experience" id="experience">
    <div class="mascot-stage" id="mascotStage" aria-hidden="true">
      <div class="halo"></div>
      <div class="scene-symbol" id="sceneSymbol">✿</div>
      <svg class="mascot mascot--cat" viewBox="0 0 220 260" role="presentation">
        <defs>
          <radialGradient id="furFill" cx="43%" cy="28%" r="76%">
            <stop offset="0" stop-color="#fff4e6"/>
            <stop offset="1" stop-color="#e8b78f"/>
          </radialGradient>
          <linearGradient id="bodyFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff0de"/>
            <stop offset="1" stop-color="#dba982"/>
          </linearGradient>
          <linearGradient id="scarfFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffb5c8"/>
            <stop offset="1" stop-color="#d8759d"/>
          </linearGradient>
        </defs>
        <path class="cat-tail" d="M145 202c20 10 39 5 42-10 2-9-4-16-13-16-7 0-11 5-10 11" fill="none" stroke="#e9bd9a" stroke-width="13" stroke-linecap="round"/>
        <path d="M145 202c20 10 39 5 42-10 2-9-4-16-13-16-7 0-11 5-10 11" fill="none" stroke="#ffe8d1" stroke-width="6" stroke-linecap="round" opacity=".68"/>
        <g class="cat-ears">
          <path d="M66 100 72 47q1-8 8-3l34 37Zm88 0-6-53q-1-8-8-3l-34 37Z" fill="url(#furFill)" stroke="#fff0e1" stroke-width="2"/>
          <path d="m76 77 2-21 17 17Zm68 0-2-21-17 17Z" fill="#d9859b" opacity=".75"/>
        </g>
        <path d="M148 176q25-2 28 15" fill="none" stroke="#f4d2b5" stroke-width="18" stroke-linecap="round"/>
        <path d="M81 160q29-17 58 0 17 16 13 51-8 20-42 21-34-1-42-21-4-35 13-51Z" fill="url(#bodyFill)" stroke="#fff0e1" stroke-width="2"/>
        <ellipse cx="110" cy="192" rx="24" ry="29" fill="#fff5e9" opacity=".88"/>
        <path d="M83 204q-10 11-8 20 2 7 17 6 9-1 13-7v-12m32-7q10 11 8 20-2 7-17 6-9-1-13-7v-12" fill="#f7dfc9" stroke="#fff0e1" stroke-width="2"/>
        <g class="cat-head">
          <path d="M67 105c0-27 18-45 43-45s43 18 43 45v8c0 27-17 45-43 45s-43-18-43-45Z" fill="url(#furFill)" stroke="#fff0e1" stroke-width="2"/>
          <path d="M85 104q8 10 16 0m18 0q8 10 16 0" fill="none" stroke="#583948" stroke-width="3" stroke-linecap="round"/>
          <path d="m105 117 5-4 5 4-5 5Z" fill="#c8758e"/>
          <path d="M110 122q-4 7-10 3m10-3q4 7 10 3" fill="none" stroke="#77505a" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="82" cy="121" rx="7" ry="4" fill="#ec9caa" opacity=".72"/>
          <ellipse cx="138" cy="121" rx="7" ry="4" fill="#ec9caa" opacity=".72"/>
          <path d="M77 115 56 110m22 13-23 2m88-10 21-5m-21 15 23 2" fill="none" stroke="#a77971" stroke-width="1.7" stroke-linecap="round" opacity=".85"/>
        </g>
        <path d="M78 153q32 17 64 0l-4 17q-28 15-56 0Z" fill="url(#scarfFill)" stroke="#ffe8ef" stroke-width="1.5"/>
        <path d="m139 160 15 4-12 18-8-9Z" fill="#e587a5" stroke="#ffe8ef" stroke-width="1.5"/>
        <g class="cat-arm cat-arm--right">
          <path d="M143 174q19-3 23-20" fill="none" stroke="#e8b78f" stroke-width="12" stroke-linecap="round"/>
          <circle cx="166" cy="151" r="7" fill="#f7dfc9"/>
          <path d="M166 149v-7m5 9 5-4m-11 3-5-5" fill="none" stroke="#f7dfc9" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g transform="translate(111 180)">
          <circle r="9" fill="#ffe4a8" stroke="#fff5dc" stroke-width="2"/>
          <text x="0" y="2.5" text-anchor="middle" fill="#78546b" font-family="Arial,sans-serif" font-size="5.5" font-weight="800">RIO</text>
        </g>
        <path class="twinkle" d="M48 84l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#ffe7a8"/>
        <circle class="twinkle twinkle--two" cx="170" cy="91" r="3.5" fill="#fff"/>
      </svg>
    </div>

    <section class="screen opening is-active" id="opening" aria-labelledby="openingTitle">
      <div class="opening-copy">
        <p class="eyebrow">RIO CÓ MỘT MÓN QUÀ NHỎ</p>
        <h1 id="openingTitle">Một ngày<br><em>thật đáng yêu</em></h1>
        <p class="lead" id="openingLead">Một lời chúc nhỏ từ Rio và bạn, gửi đến những người phụ nữ tuyệt vời quanh mình.</p>
        <button class="primary-button" id="startButton" type="button">Chạm để bắt đầu <span aria-hidden="true">✦</span></button>
        <p class="hint">Chạm để bắt đầu pháo hoa và nhận lời chúc</p>
      </div>
    </section>

    <section class="screen story" id="story" aria-live="polite" aria-atomic="true" hidden>
      <div class="story-copy" id="storyCopy">
        <p class="eyebrow" id="eyebrow"></p>
        <h2 id="title"></h2>
        <p class="lead" id="copy"></p>
        <div class="choices" id="choices" hidden>
          <button class="choice choice--yes" type="button" data-answer="yes">Rồi nè <span aria-hidden="true">♡</span></button>
          <button class="choice" type="button" data-answer="no">Chưa nữa <span aria-hidden="true">✦</span></button>
        </div>
        <p class="signature" id="signature" hidden></p>
        <div class="controls">
          <button class="next-button" id="nextButton" type="button">Tiếp tục <span aria-hidden="true">↗</span></button>
          <button class="replay-button" id="replayButton" type="button" hidden>Xem lại từ đầu <span aria-hidden="true">↺</span></button>
        </div>
        <p class="hint" id="tapHint">Hoặc chạm vào màn hình để đi tiếp</p>
      </div>
    </section>
  </main>

  <footer class="footer">GỬI BẰNG CẢ TẤM LÒNG <span>·</span> TỪ RIO VÀ BẠN</footer>
</body>
</html>
