<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100824">
  <meta name="description" content="Một lời chúc 20/10 dịu dàng, có pháo hoa và giai điệu nhẹ, gửi từ Thông Bạch.">
  <meta property="og:title" content="Một ngày thật dịu dàng · 20/10">
  <meta property="og:description" content="Chạm để bắt đầu một câu chuyện nhỏ dành cho bạn.">
  <title>Một ngày thật dịu dàng · 20/10</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-scene="opening">
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div class="aurora aurora--left" aria-hidden="true"></div>
  <div class="aurora aurora--right" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span aria-hidden="true">✿</span><span>20 · 10&nbsp; / &nbsp;LỜI CHÚC DỊU DÀNG</span></div>
    <button class="sound-button" id="soundToggle" type="button" aria-label="Bật nhạc nhẹ" aria-pressed="false">
      <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="soundLabel">NHẠC NHẸ · TẮT</span>
    </button>
  </header>

  <div class="progress" id="progress" aria-hidden="true"></div>

  <main class="experience" id="experience">
    <div class="mascot-stage" id="mascotStage" aria-hidden="true">
      <div class="halo"></div>
      <div class="scene-symbol" id="sceneSymbol">✿</div>
      <svg class="mascot" viewBox="0 0 220 260" role="presentation">
        <defs>
          <radialGradient id="petalFill" cx="50%" cy="35%" r="70%">
            <stop offset="0" stop-color="#fff7ff"/>
            <stop offset="1" stop-color="#eda6d8"/>
          </radialGradient>
          <linearGradient id="dressFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7d9ff"/>
            <stop offset="1" stop-color="#ac91ff"/>
          </linearGradient>
          <linearGradient id="wingFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".83"/>
            <stop offset="1" stop-color="#c9b6ff" stop-opacity=".22"/>
          </linearGradient>
        </defs>
        <g class="wings">
          <path class="wing wing--left" d="M91 145C50 112 24 123 31 154c6 26 32 35 64 16Z" fill="url(#wingFill)" stroke="#fff" stroke-opacity=".78" stroke-width="2"/>
          <path class="wing wing--right" d="M129 145c41-33 67-22 60 9-6 26-32 35-64 16Z" fill="url(#wingFill)" stroke="#fff" stroke-opacity=".78" stroke-width="2"/>
          <path d="M43 145c17-4 31 2 42 16M177 145c-17-4-31 2-42 16" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/>
        </g>
        <g class="crown">
          <ellipse cx="110" cy="67" rx="11" ry="23" fill="url(#petalFill)"/>
          <ellipse cx="110" cy="67" rx="11" ry="23" fill="url(#petalFill)" transform="rotate(60 110 87)"/>
          <ellipse cx="110" cy="67" rx="11" ry="23" fill="url(#petalFill)" transform="rotate(120 110 87)"/>
          <ellipse cx="110" cy="67" rx="11" ry="23" fill="url(#petalFill)" transform="rotate(180 110 87)"/>
          <ellipse cx="110" cy="67" rx="11" ry="23" fill="url(#petalFill)" transform="rotate(240 110 87)"/>
          <ellipse cx="110" cy="67" rx="11" ry="23" fill="url(#petalFill)" transform="rotate(300 110 87)"/>
          <circle cx="110" cy="87" r="7" fill="#ffe9a6"/>
        </g>
        <g class="face">
          <ellipse cx="110" cy="120" rx="34" ry="37" fill="#ffe6d9"/>
          <path d="M93 118q5 7 10 0M127 118q5 7 10 0" fill="none" stroke="#4f3154" stroke-width="2.7" stroke-linecap="round"/>
          <ellipse cx="91" cy="130" rx="6" ry="3.5" fill="#f39cbd" opacity=".7"/>
          <ellipse cx="129" cy="130" rx="6" ry="3.5" fill="#f39cbd" opacity=".7"/>
          <path d="M105 132q5 6 10 0" fill="none" stroke="#bd617e" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <path class="neck" d="M101 151h18v14h-18z" fill="#f8c8c5"/>
        <path class="dress" d="M91 162q19-10 38 0l21 49q-40 20-80 0Z" fill="url(#dressFill)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
        <path d="M110 163v46M87 187q23 11 46 0" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
        <path class="arm arm--left" d="M94 170q-24 8-27 27" fill="none" stroke="#ffe6d9" stroke-width="9" stroke-linecap="round"/>
        <path class="arm arm--right" d="M126 170q24-1 29-22" fill="none" stroke="#ffe6d9" stroke-width="9" stroke-linecap="round"/>
        <circle cx="155" cy="148" r="5.2" fill="#ffe6d9"/>
        <path d="M99 211l-5 17m27-17 5 17" fill="none" stroke="#ffe6d9" stroke-width="7" stroke-linecap="round"/>
        <path d="M87 229q7-6 14 0m22 0q7-6 14 0" fill="none" stroke="#ffd98a" stroke-width="4" stroke-linecap="round"/>
        <path d="M79 205q-12 8-20 1M151 205q12 8 20 1" fill="none" stroke="#6fd6b2" stroke-width="3" stroke-linecap="round"/>
        <path d="M59 206q-9-8-12 2 7 9 12-2Zm112 0q9-8 12 2-7 9-12-2Z" fill="#79d4ad"/>
        <circle class="twinkle" cx="55" cy="103" r="3" fill="#ffe7a8"/>
        <path class="twinkle twinkle--two" d="M164 78l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#fff"/>
      </svg>
    </div>

    <section class="screen opening is-active" id="opening" aria-labelledby="openingTitle">
      <div class="opening-copy">
        <p class="eyebrow">MỘT MÓN QUÀ NHỎ ĐANG CHỜ</p>
        <h1 id="openingTitle">Một ngày<br><em>thật dịu dàng</em></h1>
        <p class="lead" id="openingLead">Một câu chuyện nhỏ gửi đến những người phụ nữ tuyệt vời quanh bạn.</p>
        <button class="primary-button" id="startButton" type="button">Chạm để bắt đầu <span aria-hidden="true">✦</span></button>
        <p class="hint">Pháo hoa và giai điệu nhẹ sẽ bắt đầu khi bạn chạm</p>
      </div>
    </section>

    <section class="screen story" id="story" aria-live="polite" aria-atomic="true" hidden>
      <div class="story-copy" id="storyCopy">
        <p class="eyebrow" id="eyebrow"></p>
        <h2 id="title"></h2>
        <p class="lead" id="copy"></p>
        <div class="choices" id="choices" hidden>
          <button class="choice choice--yes" type="button" data-answer="yes">Rồi nè <span aria-hidden="true">♡</span></button>
          <button class="choice" type="button" data-answer="no">Chưa nữa <span aria-hidden="true">✦</span></button>
        </div>
        <p class="signature" id="signature" hidden></p>
        <div class="controls">
          <button class="next-button" id="nextButton" type="button">Tiếp tục <span aria-hidden="true">↗</span></button>
          <button class="replay-button" id="replayButton" type="button" hidden>Xem lại từ đầu <span aria-hidden="true">↺</span></button>
        </div>
        <p class="hint" id="tapHint">Hoặc chạm vào màn hình để đi tiếp</p>
      </div>
    </section>
  </main>

  <footer class="footer">GỬI BẰNG CẢ TẤM LÒNG <span>·</span> THÔNG BẠCH</footer>
</body>
</html>
